<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包图片去水印工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 30px;
            margin-bottom: 20px;
        }
        .input-area {
            position: relative;
        }
        .input-area textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            transition: border-color 0.3s;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-area .hint {
            position: absolute;
            bottom: -25px;
            left: 0;
            color: #999;
            font-size: 12px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result-area {
            display: none;
        }
        .result-area.show {
            display: block;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .result-header h3 {
            color: #333;
            font-size: 18px;
        }
        .result-header .count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .image-item {
            position: relative;
            background: #f5f5f5;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
        }
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-item .actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 5px;
            padding: 5px;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .image-item:hover .actions {
            opacity: 1;
        }
        .image-item .action-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .image-item .action-btn:hover {
            background: white;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fff5f5;
            border-left: 4px solid #ff4d4f;
            padding: 15px;
            border-radius: 8px;
            color: #ff4d4f;
            margin-top: 15px;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>豆包图片去水印工具</h1>
            <p>输入豆包分享链接，一键提取无水印图片</p>
        </div>

        <!-- 输入区域 -->
        <div class="card">
            <div class="input-area">
                <textarea id="inputText" placeholder="请输入豆包分享链接，例如：&#10;https://www.doubao.com/thread/xxxxxx"></textarea>
                <span class="hint">支持 doubao.com 和 qianwen.com 的分享链接</span>
            </div>
            <button class="btn" id="parseBtn">开始解析</button>
        </div>

        <!-- 结果区域 -->
        <div class="card result-area" id="resultArea">
            <div class="result-header">
                <h3>解析结果</h3>
                <span class="count" id="imageCount">0 张图片</span>
            </div>
            
            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在解析中...</p>
            </div>

            <!-- 错误状态 -->
            <div class="error" id="errorMsg" style="display: none;"></div>

            <!-- 图片列表 -->
            <div class="image-grid" id="imageGrid">
                <!-- 图片将在这里动态生成 -->
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <p>暂无图片</p>
            </div>
        </div>
    </div>

    <!-- 引入前端逻辑 -->
    <script src="/static/assets/app-runtime.js"></script>
</body>
</html>
